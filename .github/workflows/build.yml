name: Build image

# Push to master → test, build the image and push it to GHCR. That is the whole
# job: this repo publishes a *candidate*, it does not deploy. Whoever runs it
# pins a digest of it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # The end-to-end test's CA. Pinned so a Pebble release can't change the
  # test underneath a commit; bump it on purpose.
  PEBBLE_VERSION: v2.10.1

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Client script
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          bash -n client/dns01-issuer-client
          shellcheck --severity=warning client/dns01-issuer-client

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@${PEBBLE_VERSION}
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@${PEBBLE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: End-to-end tests (Pebble)
        run: bun run test:e2e

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          # Deployers verify this label against the commit their pin claims.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize the pin for this build
        run: |
          {
            echo "### Image published"
            echo
            echo '```json'
            echo '{'
            echo '  "image": "${{ env.REGISTRY }}/${{ env.IMAGE }}",'
            echo '  "digest": "${{ steps.push.outputs.digest }}",'
            echo '  "source": {'
            echo '    "repo": "${{ github.repository }}",'
            echo '    "commit": "${{ github.sha }}"'
            echo '  }'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
